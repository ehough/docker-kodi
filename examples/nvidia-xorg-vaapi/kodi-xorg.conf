Section "ServerLayout"
    Identifier  "kodi"
    Screen 0    "screen"
EndSection

Section "Device"
    Identifier  "gpu"
    Driver      "nvidia"
    BusID       "PCI:2:0:0"          # RTX 2070 (10de:1f02) on the NAS
    Option      "ConnectedMonitor" "HDMI-0"
    Option      "AllowEmptyInitialConfiguration" "true"
EndSection

Section "Screen"
    Identifier  "screen"
    Device      "gpu"
    Option      "DefaultDepth" "24"
EndSection
